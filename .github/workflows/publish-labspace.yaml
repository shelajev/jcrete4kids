name: Publish Labspace

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  WORKSPACE_IMAGE: olegselajev241/jcrete4kids-labspace-workspace:latest
  LABSPACE_ARTIFACT: olegselajev241/jcrete4kids-labspace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push workspace image
        uses: docker/build-push-action@v6
        with:
          context: ./workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WORKSPACE_IMAGE }}

      - name: Publish Labspace Compose artifact
        run: |
          docker compose \
            -f oci://dockersamples/labspace \
            -f compose.override.yaml \
            publish "$LABSPACE_ARTIFACT" \
            --with-env \
            --resolve-image-digests \
            -y
