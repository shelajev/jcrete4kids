name: Publish Labspace

on:
  workflow_dispatch:
    inputs:
      rebuild_workspace:
        description: Rebuild and push the workspace image
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-labspace.yaml
      - compose.override.yaml
      - labspace/**
      - workspace/**

env:
  WORKSPACE_IMAGE: olegselajev241/jcrete4kids-labspace-workspace:latest
  LABSPACE_ARTIFACT: olegselajev241/jcrete4kids-labspace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect workspace image changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workspace=${{ inputs.rebuild_workspace }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if grep -q '^workspace/' <<<"$changed_files"; then
            echo "workspace=true" >> "$GITHUB_OUTPUT"
          else
            echo "workspace=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.workspace == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push workspace image
        if: steps.changes.outputs.workspace == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WORKSPACE_IMAGE }}

      - name: Publish Labspace Compose artifact
        run: |
          yes | docker compose \
            -f oci://dockersamples/labspace \
            -f compose.override.yaml \
            publish "$LABSPACE_ARTIFACT" \
            --with-env \
            --resolve-image-digests \
            -y
